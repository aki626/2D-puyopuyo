<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2D Puyo Puyo</title>
<style>
  body { background:#111; color:#fff; text-align:center; }
  canvas { background:#222; margin-top:20px; }
</style>
</head>
<body>

<h1>2D Puyo Puyo</h1>
<canvas id="game" width="240" height="480"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 6;
const ROWS = 12;
const SIZE = 40;

const colors = ["red","yellow","green","blue","purple"];

let field = Array.from({length:ROWS},()=>Array(COLS).fill(null));

let piece = {
  x: 2,
  y: 0,
  blocks: [
    {x:0, y:0, color:colors[Math.floor(Math.random()*5)]},
    {x:0, y:-1, color:colors[Math.floor(Math.random()*5)]}
  ]
};

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // field
  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(field[y][x]){
        ctx.fillStyle = field[y][x];
        ctx.fillRect(x*SIZE,y*SIZE,SIZE,SIZE);
      }
    }
  }

  // piece
  for(const b of piece.blocks){
    ctx.fillStyle = b.color;
    ctx.fillRect((piece.x+b.x)*SIZE,(piece.y+b.y)*SIZE,SIZE,SIZE);
  }
}

function canMove(dx,dy){
  for(const b of piece.blocks){
    let nx = piece.x + b.x + dx;
    let ny = piece.y + b.y + dy;
    if(nx<0 || nx>=COLS || ny>=ROWS) return false;
    if(ny>=0 && field[ny][nx]) return false;
  }
  return true;
}

function rotate(){
  let b = piece.blocks[1];
  let nx = -b.y;
  let ny = b.x;
  if(canMove(nx-b.x, ny-b.y)){
    b.x = nx;
    b.y = ny;
  }
}

function lockPiece(){
  for(const b of piece.blocks){
    let x = piece.x + b.x;
    let y = piece.y + b.y;
    if(y>=0) field[y][x] = b.color;
  }
  clearPuyo();
  spawnPiece();
}

function spawnPiece(){
  piece = {
    x: 2,
    y: 0,
    blocks: [
      {x:0, y:0, color:colors[Math.floor(Math.random()*5)]},
      {x:0, y:-1, color:colors[Math.floor(Math.random()*5)]}
    ]
  };
}

function clearPuyo(){
  let visited = Array.from({length:ROWS},()=>Array(COLS).fill(false));
  let toClear = [];

  function dfs(x,y,color,list){
    if(x<0||x>=COLS||y<0||y>=ROWS) return;
    if(visited[y][x]) return;
    if(field[y][x]!==color) return;
    visited[y][x]=true;
    list.push({x,y});
    dfs(x+1,y,color,list);
    dfs(x-1,y,color,list);
    dfs(x,y+1,color,list);
    dfs(x,y-1,color,list);
  }

  for(let y=0;y<ROWS;y++){
    for(let x=0;x<COLS;x++){
      if(field[y][x]){
        let list=[];
        dfs(x,y,field[y][x],list);
        if(list.length>=4) toClear.push(...list);
      }
    }
  }

  for(const c of toClear){
    field[c.y][c.x]=null;
  }

  if(toClear.length>0) applyGravity();
}

function applyGravity(){
  for(let x=0;x<COLS;x++){
    for(let y=ROWS-1;y>=0;y--){
      if(!field[y][x]){
        for(let yy=y-1;yy>=0;yy--){
          if(field[yy][x]){
            field[y][x]=field[yy][x];
            field[yy][x]=null;
            break;
          }
        }
      }
    }
  }
}

document.addEventListener("keydown",e=>{
  if(e.key==="a" && canMove(-1,0)) piece.x--;
  if(e.key==="d" && canMove(1,0)) piece.x++;
  if(e.key==="s" && canMove(0,1)) piece.y++;
  if(e.key==="w") rotate();
});

function update(){
  if(canMove(0,1)){
    piece.y++;
  } else {
    lockPiece();
  }
  draw();
}

setInterval(update,500);
</script>

</body>
</html>
