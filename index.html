<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Aki Puyo Engine X</title>

<style>
body {
  background: radial-gradient(circle at center, #0a0018, #000);
  color: #fff;
  text-align: center;
  font-family: "Noto Sans JP", sans-serif;
  overflow-x: hidden;
}

h1 {
  font-size: 32px;
  margin-top: 20px;
  color: #ff00ff;
  text-shadow: 0 0 15px #ff00ff;
}

canvas {
  background: #120022;
  margin: 10px;
  border: 3px solid #ff00ff;
  border-radius: 10px;
  box-shadow: 0 0 25px #ff00ff, 0 0 50px #9900ff inset;
}

#chainText {
  position: fixed;
  top: 40%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 60px;
  color: #ff00ff;
  text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff33ff;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}

#controls {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 15px;
  z-index: 9999;
}

.btn {
  width: 70px;
  height: 70px;
  background: #1a002a;
  border: 2px solid #ff00ff;
  border-radius: 12px;
  color: #fff;
  font-size: 22px;
  display: flex;
  justify-content: center;
  align-items: center;
  user-select: none;
  box-shadow: 0 0 15px #ff00ff;
  transition: 0.15s;
}

.btn:active {
  transform: scale(0.9);
  box-shadow: 0 0 25px #ff33ff;
  border-color: #ff33ff;
}

@media (max-width: 600px) {
  canvas {
    width: 180px !important;
    height: 360px !important;
  }
  #controls {
    bottom: 10px;
  }
  .btn {
    width: 60px;
    height: 60px;
    font-size: 18px;
  }
}
</style>
</head>
<body>

<h1>🌈 Aki Puyo Engine X – 1人用 完璧版</h1>

<canvas id="p1" width="240" height="480"></canvas>

<div id="chainText"></div>

<div id="controls">
  <div class="btn" id="left">←</div>
  <div class="btn" id="right">→</div>
  <div class="btn" id="rotate">↻</div>
  <div class="btn" id="down">↓</div>
</div>

<script>
class PuyoGame {
  constructor(canvas){
    this.ctx = canvas.getContext("2d");
    this.COLS = 6;
    this.ROWS = 12;
    this.SIZE = 40;

    this.colors = ["#ff3366","#ffcc00","#33ff66","#3399ff","#cc33ff"];
    this.faces = ["😄","😳","😵"];

    this.field = Array.from({length:this.ROWS},()=>Array(this.COLS).fill(null));

    this.spawnPiece();

    this.lastFall = 0;
    this.fallSpeed = 500;

    this.chainCount = 0;
  }

  spawnPiece(){
    this.piece = {
      x: 2,
      y: -1,
      blocks: [
        {x:0, y:0, color:this.colors[Math.floor(Math.random()*5)], face:"😄"},
        {x:0, y:-1, color:this.colors[Math.floor(Math.random()*5)], face:"😄"}
      ]
    };
  }

  drawPuyo(x, y, color, face){
    const ctx = this.ctx;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, this.SIZE/2 - 4, 0, Math.PI*2);
    ctx.shadowColor = color;
    ctx.shadowBlur = 20;
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = "#fff";
    ctx.font = "20px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(face, x, y+6);
  }

  draw(){
    const ctx = this.ctx;
    ctx.clearRect(0,0,240,480);

    for(let y=0;y<this.ROWS;y++){
      for(let x=0;x<this.COLS;x++){
        if(this.field[y][x]){
          this.drawPuyo(
            x*this.SIZE + this.SIZE/2,
            y*this.SIZE + this.SIZE/2,
            this.field[y][x].color,
            this.field[y][x].face
          );
        }
      }
    }

    for(const b of this.piece.blocks){
      this.drawPuyo(
        (this.piece.x+b.x)*this.SIZE + this.SIZE/2,
        (this.piece.y+b.y)*this.SIZE + this.SIZE/2,
        b.color,
        b.face
      );
    }
  }

  canMove(dx,dy){
    for(const b of this.piece.blocks){
      let nx = this.piece.x + b.x + dx;
      let ny = this.piece.y + b.y + dy;
      if(nx<0 || nx>=this.COLS || ny>=this.ROWS) return false;
      if(ny>=0 && this.field[ny][nx]) return false;
    }
    return true;
  }

  rotate(){
    let b = this.piece.blocks[1];
    let nx = -b.y;
    let ny = b.x;
    if(this.canMove(nx-b.x, ny-b.y)){
      b.x = nx;
      b.y = ny;
    }
  }

  lockPiece(){
    for(const b of this.piece.blocks){
      let x = this.piece.x + b.x;
      let y = this.piece.y + b.y;
      if(y>=0) this.field[y][x] = {color:b.color, face:"😵"};
    }
    this.clearPuyo();
    this.spawnPiece();
  }

  explode(x, y, color){
    const ctx = this.ctx;
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(x, y, this.SIZE, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  showChain(n){
    const t = document.getElementById("chainText");
    t.innerText = `${n}連鎖！`;
    t.style.opacity = 1;
    setTimeout(()=>t.style.opacity=0, 700);
  }

  clearPuyo(){
    let visited = Array.from({length:this.ROWS},()=>Array(this.COLS).fill(false));
    let toClear = [];

    const dfs = (x,y,color,list)=>{
      if(x<0||x>=this.COLS||y<0||y>=this.ROWS) return;
      if(visited[y][x]) return;
      if(!this.field[y][x] || this.field[y][x].color!==color) return;
      visited[y][x]=true;
      list.push({x,y});
      dfs(x+1,y,color,list);
      dfs(x-1,y,color,list);
      dfs(x,y+1,color,list);
      dfs(x,y-1,color,list);
    };

    for(let y=0;y<this.ROWS;y++){
      for(let x=0;x<this.COLS;x++){
        if(this.field[y][x]){
          let list=[];
          dfs(x,y,this.field[y][x].color,list);
          if(list.length>=4) toClear.push(...list);
        }
      }
    }

    if(toClear.length>0){
      this.chainCount++;
      this.showChain(this.chainCount);

      for(const c of toClear){
        this.explode(
          c.x*this.SIZE + this.SIZE/2,
          c.y*this.SIZE + this.SIZE/2,
          this.field[c.y][c.x].color
        );
        this.field[c.y][c.x]=null;
      }
      this.applyGravity();
      this.clearPuyo();
    } else {
      this.chainCount = 0;
    }
  }

  applyGravity(){
    for(let x=0;x<this.COLS;x++){
      for(let y=this.ROWS-1;y>=0;y--){
        if(!this.field[y][x]){
          for(let yy=y-1;yy>=0;yy--){
            if(this.field[yy][x]){
              this.field[y][x]=this.field[yy][x];
              this.field[yy][x]=null;
              break;
            }
          }
        }
      }
    }
  }

  update(time){
    if(time - this.lastFall > this.fallSpeed){
      if(this.canMove(0,1)){
        this.piece.y++;
      } else {
        this.lockPiece();
      }
      this.lastFall = time;
    }
    this.draw();
  }
}

const game1 = new PuyoGame(document.getElementById("p1"));

document.addEventListener("keydown",e=>{
  if(e.key==="a" && game1.canMove(-1,0)) game1.piece.x--;
  if(e.key==="d" && game1.canMove(1,0)) game1.piece.x++;
  if(e.key==="s" && game1.canMove(0,1)) game1.piece.y++;
  if(e.key==="w") game1.rotate();
});

const mobile = {left:false,right:false,down:false};
document.getElementById("left").ontouchstart = ()=>mobile.left=true;
document.getElementById("left").ontouchend = ()=>mobile.left=false;
document.getElementById("right").ontouchstart = ()=>mobile.right=true;
document.getElementById("right").ontouchend = ()=>mobile.right=false;
document.getElementById("down").ontouchstart = ()=>mobile.down=true;
document.getElementById("down").ontouchend = ()=>mobile.down=false;
document.getElementById("rotate").ontouchstart = ()=>game1.rotate();

function loop(time){
  if(mobile.left && game1.canMove(-1,0)) game1.piece.x--;
  if(mobile.right && game1.canMove(1,0)) game1.piece.x++;
  if(mobile.down && game1.canMove(0,1)) game1.piece.y++;

  game1.update(time);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

</body>
</html>
